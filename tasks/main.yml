---
- ansible.builtin.import_tasks: pre_tasks.yml

- ansible.builtin.include_tasks: redhat9.yml
  when: >-
    (ansible_os_family | lower == 'redhat') and
    (ansible_distribution_major_version == '9')

- ansible.builtin.include_tasks: debian.yml
  when: ansible_os_family | lower == 'debian'

- name: zeroc ice | Display all variables/facts known for a host
  ansible.builtin.debug:
    msg: System {{ inventory_hostname }} has {{ ice_binaries_symlink_dest }}


- name: zeroc ice | symlink binaries
  become: true
  ansible.builtin.file:
    force: true
    path: "{{ ice_binaries_symlink_dest  }}/{{ item }}"
    src: /opt/ice/bin/{{ item }}
    state: link
  when: 'ice_binaries_symlink_dest | length > 0'
  with_items:
    - glacier2router
    - icegridadmin
    - icegridnode


- command: "ls -l /opt"
  register: dir_out
  changed_when: false

- debug: var={{item}}
  with_items: dir_out
  changed_when: false

- name: debug run command ice
  #command: "/opt/Ice-3.6.5/bin/icegridnode --version"
  shell: "{{ ice_binaries_symlink_dest }}/icegridnode --version "
  register: sss
  changed_when: false
  ignore_errors: true
  when: >-
    (ansible_facts.get('architecture') == 'aarch64')

- debug:
    msg: "2. command output is {{ sss }}"
  changed_when: false
  when: >-
    (ansible_facts.get('architecture') == 'aarch64')
- name: Diagnose command execution
  ansible.builtin.shell: |  
    file  /usr/local/bin/icegridnode
  register: diagnostic
  changed_when: false
  failed_when: false
  when: >-
    (ansible_facts.get('architecture') == 'aarch64')

- name: Display diagnostic information
  changed_when: false
  ansible.builtin.debug:
    var: diagnostic
  when: >-
    (ansible_facts.get('architecture') == 'aarch64')

####readlink -f /usr/local/bin/command
#namei -l /usr/local/bin/command
##
- name: Diagnose command execution  read link
  ansible.builtin.shell: readlink -f /usr/local/bin/icegridnode
  register: diagnostic
  changed_when: false
  failed_when: false
  when: >-
    (ansible_facts.get('architecture') == 'aarch64')

- name: Display diagnostic information readlink
  changed_when: false
  ansible.builtin.debug:
    var: diagnostic
  when: >-
    (ansible_facts.get('architecture') == 'aarch64')

- name: Diagnose command execution inamei -l
  ansible.builtin.shell: namei -l /usr/local/bin/icegridnode
  register: diagnostic
  changed_when: false
  failed_when: false
  when: >-
    (ansible_facts.get('architecture') == 'aarch64')

- name: Display diagnostic information namei -l
  changed_when: false
  ansible.builtin.debug:
    var: diagnostic
  when: >-
    (ansible_facts.get('architecture') == 'aarch64')
